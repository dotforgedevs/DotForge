.shade{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(5,10,36,.15),rgba(5,10,36,.65));z-index:-1}
main{width:100%;max-width:520px;padding:24px 20px;text-align:center}
h1{margin:0 0 6px;font-size:clamp(2.4rem,9vw,3.6rem);font-weight:700;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:0 0 28px;color:var(--muted);font-size:1rem}
.box{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.label{margin:0 0 10px;font-size:.85rem;color:var(--muted)}
.ca{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.ca code{flex:1;min-width:0;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button,.x{font:inherit;cursor:pointer}
button{border:0;border-radius:9px;padding:9px 16px;font-weight:600;color:#06102e;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.x{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);text-decoration:none;font-weight:600}
.x svg{width:18px;height:18px;fill:currentColor}
.socials{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.soc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem}
.soc .row{display:inline-flex;align-items:center;gap:8px}
.soc svg{width:18px;height:18px;fill:currentColor}
.soc small{font-size:.72rem;font-weight:500;color:var(--muted)}
.soc.off{opacity:.7;cursor:default}
a.soc:hover{filter:brightness(1.2)}
a.soc:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
button:focus-visible,.x:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.x:hover,button:hover{filter:brightness(1.15)}
@media (prefers-reduced-motion:no-preference){.x,button{transition:filter .2s}}
</style>

<script>
// Ganti nilai CA di bawah dengan contract address asli
var CA = "Coming soon";
var el = document.getElementById("ca"), btn = document.getElementById("copy");
el.textContent = CA;
btn.addEventListener("click", function () {
  if (CA === "Coming soon") { btn.textContent = "Not yet"; setTimeout(function(){btn.textContent="Copy"},1400); return; }
  try {
    navigator.clipboard.writeText(CA).then(function(){ btn.textContent = "Copied"; setTimeout(function(){btn.textContent="Copy"},1400); });
  } catch (e) {
    var r = document.createRange(); r.selectNodeContents(el);
    var s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
});
</script>
